name: Verificar plataforma
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:server
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npx playwright install --with-deps chromium
      - name: Verificar regras e jornadas com emuladores
        run: npx firebase emulators:exec --only auth,firestore --project demo-circuit-qscratch "npm run test:rules && npm run test:e2e"
